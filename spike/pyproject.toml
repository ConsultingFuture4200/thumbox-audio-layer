[project]
name = "thumbox-audio-layer-spike"
version = "0.0.1"
description = "Phase 0 feasibility spike: Mimi codec encode/decode roundtrip, latency + VRAM benchmarks, optional LLM-on-tokens probe. Target ≤500 LOC per PRD §10.1."
readme = "README.md"
requires-python = ">=3.11,<3.12"

# torch is intentionally NOT listed here — it must be installed against the ROCm
# wheel index on the cloud pod (or CUDA index on H100). See scripts/provision_*.sh
# and README "Setup" section for the exact install commands. This pattern matches
# /home/bob/RBOX/CLAUDE.md §12.1.
dependencies = [
  "transformers>=4.45,<5",     # MimiModel ships in 4.45+
  "soundfile>=0.12",
  "numpy>=1.26,<2",            # torch 2.5.x compatibility window
  "pyyaml>=6",
  "typer>=0.12",
  "librosa>=0.10",
  "huggingface-hub>=0.24",
]

[project.scripts]
spike = "spike.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spike"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
